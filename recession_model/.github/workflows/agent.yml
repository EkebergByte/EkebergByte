name: Macro Event-Driven Agent

on:
  schedule:
    - cron: '*/30 13-16 * * 1-5'  # 14:00-17:30 CET (Pn-Pt)
    - cron: '0 22 * * 1-5'        # 23:00 CET (Pn-Pt)
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install fredapi scikit-learn pandas joblib requests python-dotenv

      - name: Run Sentinel
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_and_predict.py

      - name: Commit state changes if updated
        run: |
          git config --global user.name 'Macro-Agent[bot]'
          git config --global user.email 'macro-agent@users.noreply.github.com'
          git add fred_state.json
          if ! git diff --quiet --staged; then
            git pull --rebase
            git commit -m "Auto-update FRED state [skip ci]"
            git push
          fi